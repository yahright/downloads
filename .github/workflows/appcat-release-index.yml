name: Publish AppCat release index

on:
  release:
    types: [published, edited, deleted, unpublished]
  push:
    branches: [main]
    paths: [".github/workflows/appcat-release-index.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appcat-release-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build public index
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            const index = {
              schema: 1,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              generated_at: new Date().toISOString(),
              releases: releases.filter(r => !r.draft).map(r => ({
                tag_name: r.tag_name,
                name: r.name,
                draft: false,
                prerelease: r.prerelease,
                assets: r.assets.filter(a => a.state === 'uploaded').map(a => ({
                  name: a.name,
                  browser_download_url: a.browser_download_url,
                  size: a.size
                }))
              }))
            };
            if (!index.releases.length) throw new Error('Empty public release index');
            const output = JSON.stringify(index, null, 2) + '\n';
            if (Buffer.byteLength(output) > 32 * 1024 * 1024) throw new Error('Index too large');
            fs.mkdirSync('appcat', { recursive: true });
            fs.writeFileSync('appcat/releases.json', output);
      - name: Publish index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- appcat/releases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(appcat): refresh public release index'
          git pull --rebase origin main
          git push origin HEAD:main
